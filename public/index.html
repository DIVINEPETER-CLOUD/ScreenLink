<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScreenLink 2.0</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0;
           margin: 0; padding: 20px; }
    .box { max-width: 800px; margin: 0 auto; }
    h1 { margin-top: 0; }
    button { background: #3b82f6; color: white; border: 0; padding: 10px 16px;
             border-radius: 6px; font-size: 15px; cursor: pointer; margin: 4px 4px 4px 0; }
    button:disabled { background: #475569; cursor: not-allowed; }
    input { padding: 10px; border-radius: 6px; border: 1px solid #475569;
            background: #1e293b; color: white; width: 70%; }
    video { width: 100%; background: black; border-radius: 8px; margin-top: 12px; }
    .card { background: #1e293b; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    #status { color: #fbbf24; }
    .hidden { display: none; }
  </style>
  <script>
    window.addEventListener("error", function (e) {
      var s = document.getElementById("status");
      if (s) s.textContent = "ERROR: " + e.message;
    });
  </script>
</head>
<body>
<div class="box">
  <h1>ScreenLink 2.0</h1>
  <p>Status: <span id="status">Starting...</span></p>

  <div id="home" class="card">
    <h3>Share your screen</h3>
    <button id="createBtn">Create room</button>
    <h3>Join a room</h3>
    <input id="joinInput" placeholder="Paste a room link or room ID">
    <button id="joinBtn">Join</button>
  </div>

  <div id="hostPanel" class="card hidden">
    <h3>You are the host</h3>
    <p>Send this link to the viewer:</p>
    <input id="roomLink" readonly>
    <div>
      <button id="copyBtn">Copy</button>
      <button id="shareBtn">Share</button>
      <button id="waBtn">WhatsApp</button>
      <button id="tgBtn">Telegram</button>
      <button id="snapBtn">Snapchat</button>
    </div>
    <div>
      <button id="startBtn">Start sharing</button>
      <button id="stopBtn" disabled>Stop sharing</button>
    </div>
    <p id="viewerInfo">Waiting for a viewer...</p>
  </div>

  <div id="viewerPanel" class="card hidden">
    <h3>You are the viewer</h3>
    <p>When the host says they are sharing, click the button.</p>
    <button id="watchBtn">Watch screen</button>
  </div>

  <video id="video" autoplay playsinline muted controls class="hidden"></video>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // ---------------------------------------------------------------
  // TURN SERVER SETTINGS: replace these three values with the ones
  // from your TURN provider (for example Metered.ca Open Relay).
  // While they are still the placeholders, the TURN entry is skipped.
  // ---------------------------------------------------------------
  const TURN = {
    host: "YOUR_TURN_HOST",
    username: "YOUR_USERNAME",
    credential: "YOUR_CREDENTIAL"
  };

  const iceServers = [{ urls: "stun:stun.l.google.com:19302" }];
  if (TURN.host && TURN.host !== "YOUR_TURN_HOST") {
    iceServers.push({
      urls: [
        "turn:" + TURN.host + ":80",
        "turn:" + TURN.host + ":443?transport=tcp",
        "turns:" + TURN.host + ":443?transport=tcp"
      ],
      username: TURN.username,
      credential: TURN.credential
    });
  } else {
    console.warn("No TURN server configured. Connections across different networks may fail.");
  }
  const rtcConfig = { iceServers: iceServers };

  let role = null;
  let roomId = null;
  let pc = null;
  let localStream = null;
  let pendingCandidates = [];   // ICE candidates that arrived before the remote description
  let pendingOffer = null;      // offer received before the host started sharing

  const $ = id => document.getElementById(id);
  const setStatus = text => { $("status").textContent = text; };

  socket.on("connect", () => setStatus("Connected to server"));
  socket.on("disconnect", () => setStatus("Disconnected from server"));
  socket.on("room-error", msg => setStatus(msg));

  function joinRoom(id, myRole) {
    roomId = id;
    role = myRole;
    socket.emit("join-room", { room: id, role: myRole });
    $("home").classList.add("hidden");
    if (myRole === "host") {
      $("hostPanel").classList.remove("hidden");
      $("roomLink").value = location.origin + "/?room=" + id;
    } else {
      $("viewerPanel").classList.remove("hidden");
    }
  }

  socket.on("room-ready", () => setStatus("In room as " + role));

  const roomFromUrl = new URLSearchParams(location.search).get("room");
  if (roomFromUrl && /^[a-f0-9]{32}$/.test(roomFromUrl)) {
    joinRoom(roomFromUrl, "viewer");
  }

  $("createBtn").onclick = async () => {
    try {
      const res = await fetch("/new-room");
      const data = await res.json();
      joinRoom(data.room, "host");
    } catch (err) {
      setStatus("Could not create a room: " + err.message);
    }
  };

  $("joinBtn").onclick = () => {
    const match = $("joinInput").value.match(/[a-f0-9]{32}/);
    if (!match) { setStatus("That does not look like a room link or ID."); return; }
    joinRoom(match[0], "viewer");
  };

  $("copyBtn").onclick = () => {
    navigator.clipboard.writeText($("roomLink").value);
    setStatus("Link copied!");
  };

  $("shareBtn").onclick = async () => {
    const link = $("roomLink").value;
    if (navigator.share) {
      try {
        await navigator.share({ title: "ScreenLink", text: "Join my ScreenLink room:", url: link });
      } catch (err) { /* share menu closed */ }
    } else {
      navigator.clipboard.writeText(link);
      setStatus("Sharing menu not available here, so the link was copied instead.");
    }
  };

  $("waBtn").onclick = () => {
    const text = encodeURIComponent("Join my ScreenLink room: " + $("roomLink").value);
    window.open("https://wa.me/?text=" + text, "_blank");
  };

  $("tgBtn").onclick = () => {
    const link = encodeURIComponent($("roomLink").value);
    const text = encodeURIComponent("Join my ScreenLink room");
    window.open("https://t.me/share/url?url=" + link + "&text=" + text, "_blank");
  };

  $("snapBtn").onclick = () => {
    const link = encodeURIComponent($("roomLink").value);
    window.open("https://www.snapchat.com/scan?attachmentUrl=" + link, "_blank");
  };

  // ---------------------------------------------------------------
  // WebRTC
  // ---------------------------------------------------------------

  // Creates a fresh peer connection (closing any old one).
  function makePeer() {
    if (pc) { pc.onicecandidate = null; pc.close(); }
    pendingCandidates = [];
    const peer = new RTCPeerConnection(rtcConfig);
    pc = peer;

    // Also send candidates one by one (trickle ICE) as a backup.
    // The main path is waitForIce(), which puts them inside the offer/answer.
    peer.onicecandidate = event => {
      if (event.candidate) socket.emit("webrtc-ice", event.candidate);
    };

    peer.oniceconnectionstatechange = () => {
      if (pc !== peer) return;
      const s = peer.iceConnectionState;
      if (s === "checking") setStatus("Connecting...");
      if (s === "connected" || s === "completed") {
        setStatus(role === "host" ? "Sharing your screen" : "Watching the host's screen");
      }
      if (s === "failed") {
        setStatus("Connection failed. The networks may need a TURN server.");
      }
    };

    return peer;
  }

  // Waits until the browser has gathered all its network candidates
  // (or 5 seconds have passed), so the offer/answer we send is complete.
  function waitForIce(peer, timeoutMs) {
    return new Promise(resolve => {
      if (peer.iceGatheringState === "complete") { resolve(); return; }
      const finish = () => {
        clearTimeout(timer);
        peer.removeEventListener("icegatheringstatechange", check);
        resolve();
      };
      const check = () => { if (peer.iceGatheringState === "complete") finish(); };
      const timer = setTimeout(finish, timeoutMs || 5000);
      peer.addEventListener("icegatheringstatechange", check);
    });
  }

  async function flushCandidates(peer) {
    const list = pendingCandidates;
    pendingCandidates = [];
    for (const c of list) {
      try { await peer.addIceCandidate(c); }
      catch (err) { console.warn("ICE problem:", err); }
    }
  }

  // Candidate sent by the other side
  socket.on("webrtc-ice", async candidate => {
    if (!pc) return;
    if (pc.remoteDescription) {
      try { await pc.addIceCandidate(candidate); }
      catch (err) { console.warn("ICE problem:", err); }
    } else {
      pendingCandidates.push(candidate);   // wait until the remote description is set
    }
  });

  socket.on("viewer-available", () => {
    $("viewerInfo").textContent = "A viewer has joined!";
  });

  // ----- Host side -----

  async function answerViewer(offer) {
    const peer = makePeer();
    localStream.getTracks().forEach(t => peer.addTrack(t, localStream));
    await peer.setRemoteDescription(offer);
    await flushCandidates(peer);
    const answer = await peer.createAnswer();
    await peer.setLocalDescription(answer);
    await waitForIce(peer);
    socket.emit("webrtc-answer", peer.localDescription);
  }

  $("startBtn").onclick = async () => {
    try {
      localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    } catch (err) {
      setStatus("Screen sharing was cancelled.");
      return;
    }
    $("startBtn").disabled = true;
    $("stopBtn").disabled = false;
    setStatus("Sharing your screen");
    localStream.getVideoTracks()[0].onended = stopSharing;

    // If a viewer already asked to watch, answer them now.
    if (pendingOffer) {
      const offer = pendingOffer;
      pendingOffer = null;
      try { await answerViewer(offer); }
      catch (err) { setStatus("Could not start the connection: " + err.message); }
    }
  };

  function stopSharing() {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    localStream = null;
    pendingOffer = null;
    if (pc) { pc.close(); pc = null; }
    socket.emit("stop-sharing");
    $("startBtn").disabled = false;
    $("stopBtn").disabled = true;
    setStatus("Sharing stopped");
  }
  $("stopBtn").onclick = stopSharing;

  socket.on("webrtc-offer", async offer => {
    if (!localStream) {
      pendingOffer = offer;   // remember it, and answer when sharing starts
      setStatus("A viewer wants to watch. Click Start sharing.");
      return;
    }
    try { await answerViewer(offer); }
    catch (err) { setStatus("Could not start the connection: " + err.message); }
  });

  // ----- Viewer side -----

  $("watchBtn").onclick = async () => {
    try {
      const peer = makePeer();
      peer.addTransceiver("video", { direction: "recvonly" });
      peer.ontrack = e => {
        const video = $("video");
        video.srcObject = e.streams[0];
        video.classList.remove("hidden");
        video.play().catch(() => { /* user can press play on the controls */ });
        setStatus("Watching the host's screen");
      };
      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);
      await waitForIce(peer);
      socket.emit("webrtc-offer", peer.localDescription);
      setStatus("Asking the host for the screen...");
    } catch (err) {
      setStatus("Could not start watching: " + err.message);
    }
  };

  socket.on("webrtc-answer", async answer => {
    if (!pc) return;
    try {
      await pc.setRemoteDescription(answer);
      await flushCandidates(pc);
    } catch (err) {
      setStatus("Could not connect: " + err.message);
    }
  });

  socket.on("sharing-stopped", () => {
    if (role === "viewer") {
      $("video").srcObject = null;
      $("video").classList.add("hidden");
      if (pc) { pc.close(); pc = null; }
      setStatus("The host stopped sharing");
    }
  });
</script>
</body>
</html>
